name: Ingest and deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest = process new zips; posters = backfill posters for existing videos"
        type: choice
        options:
          - ingest
          - posters
        default: ingest
  push:
    branches:
      - main

concurrency:
  group: ingest-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    # On a push to main the site is already up to date; only deploy it.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          # Static build from GitHub releases: apt mirrors have hung this step.
          if [ ! -x "$HOME/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/ffmpeg-bin/ffprobe" ]; then
            mkdir -p "$HOME/ffmpeg-bin"
            curl -fsSL --retry 3 --max-time 180 -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg-bin" --strip-components=2 \
              --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-bin/ffmpeg" -version | head -1
          "$HOME/ffmpeg-bin/ffprobe" -version | head -1

      - name: Run ingest
        env:
          DRIVE_SOURCES: ${{ vars.DRIVE_SOURCES }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          MAX_ZIPS_PER_RUN: ${{ vars.MAX_ZIPS_PER_RUN || '10' }}
        run: |
          if [ "${{ inputs.mode }}" = "posters" ]; then
            python -m ingest.posters
          else
            python -m ingest.main
          fi

      - name: Commit and push updated manifest and state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOTE: ingest/state.json is currently listed in .gitignore, so
          # `git add` silently skips it below until the repository owner
          # removes that entry. site/manifest.json is not ignored and will
          # still be committed correctly.
          git add site/manifest.json ingest/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ingest): update manifest and state"
            git push origin HEAD:main
          fi

  frames:
    # Runs once the videos are published, in parallel with deploy, so the
    # site never waits for frames. The run stays in the concurrency group
    # until this job ends, hence the per-run limit and the timeout.
    needs: ingest
    if: ${{ !cancelled() && needs.ingest.result != 'skipped' && inputs.mode != 'posters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/ffmpeg-bin/ffprobe" ]; then
            mkdir -p "$HOME/ffmpeg-bin"
            curl -fsSL --retry 3 --max-time 180 -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg-bin" --strip-components=2 \
              --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-bin/ffmpeg" -version | head -1
          "$HOME/ffmpeg-bin/ffprobe" -version | head -1

      - name: Extract frames
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          MAX_FRAME_VIDEOS_PER_RUN: ${{ vars.MAX_FRAME_VIDEOS_PER_RUN || '10' }}
        run: python -m ingest.frames

  deploy:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
